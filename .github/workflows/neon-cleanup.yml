name: Neon cleanup
# Each preview deployment gets a Neon branch named preview/<git-branch>.
# Neon only removes it when Vercel deletes the deployment (weeks later), so
# delete it as soon as the PR is closed, merged or not.
on:
  pull_request:
    types: [closed]

jobs:
  delete-preview-branch:
    # Fork PRs have no access to the secret and never get a Neon branch.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A PR that never produced a preview has no branch to delete; that is fine.
    continue-on-error: true
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
